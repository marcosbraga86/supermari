if(document.fonts)document.fonts.load('10px "Press Start 2P"');
let AC=null,MG=null,NB=null,muted=false,musicOn=false,mstep=0,mnext=0,mtr=0,mbpm=150;
const LEAD=[72,-1,76,-1,79,-1,76,-1,77,-1,74,-1,71,-1,0,0, 72,-1,76,-1,79,-1,84,-1,83,-1,79,-1,76,-1,0,0, 77,-1,81,-1,84,-1,81,-1,79,-1,76,-1,72,-1,0,0, 74,-1,77,-1,79,-1,77,-1,76,-1,0,0,72,-1,0,0,
79,-1,0,79,-1,0,81,-1,79,-1,76,-1,72,-1,0,0, 77,-1,0,77,-1,0,79,-1,77,-1,74,-1,71,-1,0,0, 76,-1,79,-1,83,-1,79,-1,84,-1,83,-1,81,-1,79,-1, 77,-1,76,-1,74,-1,71,-1,72,-1,-1,-1,0,0,0,0];
const BASS=[36,36,41,43,36,41,33,43],mf=m=>440*Math.pow(2,(m-69)/12);
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:.5;MG.connect(AC.destination);const n=AC.sampleRate;NB=AC.createBuffer(1,n,n);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;mnext=AC.currentTime+.1;setInterval(msched,40)}catch(e){AC=null}}
function osc(type,f,t0,dur,vol,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.006);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+dur+.03)}
function noise(t0,dur,vol,hp){const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=NB;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(MG);s.start(t0);s.stop(t0+dur+.03)}
function mstepPlay(s,t0){const bar=(s>>4)&7,i=s&15,sp=60/mbpm/4,n=LEAD[bar*16+i];
if(n>0){let len=1;while(i+len<16&&LEAD[bar*16+i+len]===-1)len++;osc('square',mf(n+mtr),t0,len*sp*.95,.06);osc('square',mf(n+mtr-12),t0,len*sp*.9,.025)}
if(i%2==0){osc('triangle',mf(BASS[bar]+mtr+((i/2)%2?12:0)),t0,sp*1.8,.17)}
if(i%8==0)osc('sine',150,t0,.12,.3,45);if(i%8==4)noise(t0,.1,.16,1500);if(i%2==0)noise(t0,.03,.04,7000)}
function msched(){if(!AC)return;if(!musicOn){mnext=Math.max(mnext,AC.currentTime+.05);return}const sp=60/mbpm/4;while(mnext<AC.currentTime+.15){mstepPlay(mstep,mnext);mnext+=sp;mstep=(mstep+1)%128}}
function sfx(k){if(!AC||muted)return;const t0=AC.currentTime;try{
if(k=='jump')osc('square',330,t0,.18,.08,880);
else if(k=='coin'){osc('square',988,t0,.07,.07);osc('square',1319,t0+.07,.25,.07)}
else if(k=='stomp'){osc('square',300,t0,.12,.1,80);noise(t0,.08,.1,800)}
else if(k=='hurt')osc('sawtooth',440,t0,.35,.12,90);
else if(k=='wave'){osc('sine',400,t0,.45,.16,1400);osc('triangle',800,t0,.45,.07,2600)}
else if(k=='die'){[392,370,349,330,311,294,277,262].forEach((f,i)=>osc('square',f,t0+i*.09,.12,.09))}
else if(k=='win'){[523,659,784,1047,784,1047].forEach((f,i)=>osc('square',f,t0+i*.11,.14,.09))}}catch(e){}}
function toggleMute(){muted=!muted;if(MG)MG.gain.value=muted?0:.5;const b=document.getElementById('mb');if(b)b.textContent=muted?'🔇':'🔊'}
